name: Daily TDnet Check

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run script
      run: |
        cat << 'EOF' > inline_script.py
        import os
        import time
        from datetime import datetime
        import requests
        from bs4 import BeautifulSoup

        TXT_FILE = "code.txt"
        output_file = "result.txt"

        headers = {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        }

        # 最初に必ずresult.txtを生成
        with open(output_file, "w", encoding="utf-8") as f_init:
            f_init.write("=== 適時開示・決算速報 取得結果 (東証公式アーカイブ版) ===\n")
            f_init.write(f"実行日時: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n")
            f_init.write("==================================================\n\n")

        if not os.path.exists(TXT_FILE):
            with open(output_file, "a", encoding="utf-8") as f_out:
                f_out.write(f"【エラー】{TXT_FILE} が見つかりません。\n")
            exit(0)

        codes = []
        with open(TXT_FILE, "r", encoding="utf-8") as f:
            for line in f:
                clean_line = line.strip()
                if not clean_line or clean_line.startswith("#"):
                    continue
                codes.append(clean_line)

        if not codes:
            with open(output_file, "a", encoding="utf-8") as f_out:
                f_out.write("【エラー】code.txt に証券コードがありません。\n")
            exit(0)

        hit_records = {}

        # 当日分の全開示がアーカイブされている東証公式のバックエンドURL
        # (現在、最新の開示一覧のベースURLは I_main_00.html に変更されています)
        url = "https://www.release.tdnet.info/inbs/I_main_00.html"
        
        try:
            response = requests.get(url, headers=headers, timeout=15)
            response.raise_for_status()
            response.encoding = "shift_jis" # 東証はShift_JIS
            
            soup = BeautifulSoup(response.text, "html.parser")
            
            # 東証TDnetのすべての開示行（tr）を走査
            rows = soup.find_all("tr")
            
            for row in rows:
                row_text = row.get_text()
                
                for code in codes:
                    # 行の中に「8101」などのコードが含まれているかチェック
                    if code in row_text:
                        # 時間、会社名、タイトル、URLを取得
                        time_elem = row.find("td", class_="yjSt")
                        time_text = time_elem.get_text(strip=True) if time_elem else "時間不明"
                        
                        title_a = row.find("a", class_="kaijiTitle")
                        if title_a:
                            title_text = title_a.get_text(strip=True)
                            
                            # 【修正】不正なドメインエラーを回避するため、完全に固定値でURLを結合
                            href_val = title_a["href"]
                            pdf_url = f"https://www.release.tdnet.info/inbs/{href_val}"
                            
                            company_elem = row.find("td", class_="yjM")
                            company_name = company_elem.get_text(strip=True) if company_elem else "企業名不明"
                            
                            record = f"[{time_text}] {company_name}\n  {title_text}\n  URL: {pdf_url}\n"
                            
                            if code not in hit_records:
                                hit_records[code] = []
                            if record not in hit_records[code]:
                                hit_records[code].append(record)
        except Exception as e:
            with open(output_file, "a", encoding="utf-8") as f_out:
                f_out.write(f"【システムエラー】東証へのアクセスまたは解析に失敗しました: {e}\n")

        # 最後に結果を追記
        with open(output_file, "a", encoding="utf-8") as f_out:
            if hit_records:
                for code, records in hit_records.items():
                    f_out.write(f"=== 証券コード: {code} ===\n")
                    for r in records:
                        f_out.write(r)
                    f_out.write("\n")
            else:
                f_out.write("本日発表された対象銘柄の適時開示情報はありませんでした。\n")
        EOF
        
        python inline_script.py

    - name: Upload Result Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tdnet-result
        path: result.txt
        retention-days: 7
