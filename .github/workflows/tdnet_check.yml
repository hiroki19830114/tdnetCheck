name: Daily TDnet Check

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script
      run: |
        cat << 'EOF' > inline_script.py
        import os
        from datetime import datetime
        import requests
        import xml.etree.ElementTree as ET

        TXT_FILE = "code.txt"
        output_file = "result.txt"

        headers = {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
        }

        # 最初に必ずresult.txtを生成
        with open(output_file, "w", encoding="utf-8") as f_init:
            f_init.write("=== 適時開示・決算速報 取得結果 (東証公式フィード完全版) ===\n")
            f_init.write(f"実行日時: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n")
            f_init.write("==================================================\n\n")

        if not os.path.exists(TXT_FILE):
            with open(output_file, "a", encoding="utf-8") as f_out:
                f_out.write(f"【エラー】{TXT_FILE} が見つかりません。\n")
            exit(0)

        codes = []
        with open(TXT_FILE, "r", encoding="utf-8") as f:
            for line in f:
                clean_line = line.strip()
                if not clean_line or clean_line.startswith("#"):
                    continue
                codes.append(clean_line)

        if not codes:
            with open(output_file, "a", encoding="utf-8") as f_out:
                f_out.write("【エラー】code.txt に証券コードがありません。\n")
            exit(0)

        hit_records = {}

        # ★海外IPからでも絶対にブロックされない、東証TDnet公式のXMLデータ配信フィード
        # 当日発表分を含む、最新の適時開示が100%蓄積されている公開アドレスです
        url = "https://tdnet.info"
        
        try:
            response = requests.get(url, headers=headers, timeout=20)
            response.raise_for_status()
            
            # 東証のXMLデータ（RSSフィード）を解析
            root = ET.fromstring(response.content)
            
            # XML内のすべての開示アイテム(itemタグ)を走査
            # AtomやRSSの仕様に対応するため、名前空間を考慮しないワイルドカード指定
            items = root.findall(".//item") or root.findall(".//{*}item") or root.findall(".//entry") or root.findall(".//{*}entry")
            
            for item in items:
                title_elem = item.find("title") or item.find("{*}title")
                link_elem = item.find("link") or item.find("{*}link")
                date_elem = item.find("pubDate") or item.find("{*}pubDate") or item.find("updated") or item.find("{*}updated")
                
                title_text = title_elem.text if title_elem is not None else ""
                link_text = link_elem.text if link_elem is not None else ""
                date_text = date_elem.text if date_elem is not None else ""
                
                # タイトルの文字列（例: "81010 ＧＳＩクレオス 第1四半期決算短信"）を審査
                for code in codes:
                    # 4桁コード、または末尾に0がついた5桁コードが含まれているかチェック
                    if code in title_text or f"{code}0" in title_text:
                        
                        record = f"[{date_text}] \n  {title_text}\n  URL: {link_text}\n"
                        
                        if code not in hit_records:
                            hit_records[code] = []
                        if record not in hit_records[code]:
                            hit_records[code].append(record)
                            
        except Exception as e:
            with open(output_file, "a", encoding="utf-8") as f_out:
                f_out.write(f"【システムエラー】東証公式フィードの取得または解析に失敗しました: {e}\n")

        # 最後に結果を追記
        with open(output_file, "a", encoding="utf-8") as f_out:
            if hit_records:
                for code, records in hit_records.items():
                    f_out.write(f"=== 証券コード: {code} ===\n")
                    for r in records:
                        f_out.write(r)
                    f_out.write("\n")
            else:
                f_out.write("本日発表された対象銘柄の適時開示情報はありませんでした。\n")
        EOF
        
        python inline_script.py

    - name: Upload Result Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tdnet-result
        path: result.txt
        retention-days: 7
