name: Daily TDnet Check

on:
  schedule:
    # 毎日 日本時間(JST)の 18:00 に自動実行する設定
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. コードを読み込む
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Pythonの環境をセットアップする
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. 必要なライブラリをインストールする
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. やのしんAPI用のPythonスクリプトを実行する
    - name: Run script
      run: |
        python chkTdnet.py

    # 5. 結果ファイルをメールで送信する（★最も安定しているバージョンに固定して復活）
    - name: Send Mail
      uses: dawidd6/action-send-mail@v3.8.1
      with:
        server_address: ://gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        
        subject: "【自動配信】TDnet適時開示 取得結果通知"
        to: "haruharuharu0114@gmail.com"
        from: "TDnet Bot <${{ secrets.MAIL_USERNAME }}>"
        
        body: "本日のTDnet適時開示のチェックが完了しました。詳細は添付のテキストファイルをご確認ください。"
        attachments: "result.txt"
