name: Daily TDnet Check

on:
  schedule:
    # 毎日 日本時間(JST)の 18:00 に自動実行する設定
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest

    # 【重要】Node 24の強制移行を回避し、一番最初のコードが100%正常に動いていた環境を維持します
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    # 1. コードを読み込む
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Pythonの環境をセットアップする
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. 必要なライブラリをインストールする
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. あなたのPythonスクリプトを実行する
    - name: Run script
      run: |
        python chkTdnet.py
        
        # もし result_*.txt というファイルが存在するかチェック
        if ls result_*.txt 1> /dev/null 2>&1; then
          FILENAME=$(ls result_*.txt | head -n 1)
          echo "RESULT_FILE=$FILENAME" >> $GITHUB_ENV
          echo "HAS_RESULT=true" >> $GITHUB_ENV
        else
          echo "HAS_RESULT=false" >> $GITHUB_ENV
          echo "本日発表された適時開示はありませんでした。" > no_result.txt
          echo "RESULT_FILE=no_result.txt" >> $GITHUB_ENV
        fi

    # 5. 一番最初のメール送信ステップ（元のバージョンのまま復活）
    - name: Send Mail
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ://gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        
        subject: "【自動配信】TDnet適時開示 取得結果通知"
        to: "haruharuharu0114@gmail.com"
        from: "TDnet Bot <${{ secrets.MAIL_USERNAME }}>"
        
        body: "本日のTDnet適時開示のチェックが完了しました。詳細は添付 of テキストファイルをご確認ください。"
        attachments: ${{ env.RESULT_FILE }}
