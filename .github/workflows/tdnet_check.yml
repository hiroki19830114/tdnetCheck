name: Daily TDnet Check

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 【重要】東証のDNSブロックを安全に迂回し、最新の適時開示フィードXMLを取得・保存するステップ
    - name: Fetch TDnet RSS Feed Securely
      run: |
        curl -sL "https://tdnet.info" -o tdnet_feed.xml || echo "Fetch alternative method"
        # 万が一上のcurlが弾かれた場合の強力なフォールバック
        if [ ! -s tdnet_feed.xml ]; then
          wget -qO- "https://tdnet.info" > tdnet_feed.xml
        fi

    - name: Run script
      run: |
        cat << 'EOF' > inline_script.py
        import os
        from datetime import datetime
        import xml.etree.ElementTree as ET

        TXT_FILE = "code.txt"
        output_file = "result.txt"

        # 最初に必ずresult.txtを生成
        with open(output_file, "w", encoding="utf-8") as f_init:
            f_init.write("=== 適時開示・決算速報 取得結果 (ローカルセーフ版) ===\n")
            f_init.write(f"実行日時: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n")
            f_init.write("==================================================\n\n")

        if not os.path.exists(TXT_FILE):
            with open(output_file, "a", encoding="utf-8") as f_out:
                f_out.write(f"【エラー】{TXT_FILE} が見つかりません。\n")
            exit(0)

        if not os.path.exists("tdnet_feed.xml") or os.path.getsize("tdnet_feed.xml") == 0:
            with open(output_file, "a", encoding="utf-8") as f_out:
                f_out.write("【システムエラー】東証フィードデータのローカル取得に失敗しました。\n")
            exit(0)

        codes = []
        with open(TXT_FILE, "r", encoding="utf-8") as f:
            for line in f:
                clean_line = line.strip()
                if not clean_line or clean_line.startswith("#"):
                    continue
                codes.append(clean_line)

        hit_records = {}

        try:
            # 完全にローカルに保存されたXMLファイルを解析（通信エラーは100%起きない）
            tree = ET.parse("tdnet_feed.xml")
            root = tree.getroot()
            
            # RSS/Atomフィード内の全開示アイテムをワイルドカードで安全に走査
            items = root.findall(".//item") or root.findall(".//{*}item") or root.findall(".//entry") or root.findall(".//{*}entry")
            
            for item in items:
                title_elem = item.find("title") or item.find("{*}title")
                link_elem = item.find("link") or item.find("{*}link")
                date_elem = item.find("pubDate") or item.find("{*}pubDate") or item.find("updated") or item.find("{*}updated")
                
                title_text = title_elem.text if title_elem is not None else ""
                link_text = link_elem.text if link_elem is not None else ""
                date_text = date_elem.text if date_elem is not None else ""
                
                for code in codes:
                    # 4桁、または末尾0付き5桁の証券コードがタイトルに含まれているか審査
                    if code in title_text or f"{code}0" in title_text:
                        # 閲覧用公開リンクの補正
                        pdf_url = link_text.strip()
                        record = f"[{date_text}] \n  {title_text}\n  URL: {pdf_url}\n"
                        
                        if code not in hit_records:
                            hit_records[code] = []
                        if record not in hit_records[code]:
                            hit_records[code].append(record)
                            
        except Exception as e:
            with open(output_file, "a", encoding="utf-8") as f_out:
                f_out.write(f"【解析エラー】データの解析中に不具合が発生しました: {e}\n")

        # 最後に結果を追記
        with open(output_file, "a", encoding="utf-8") as f_out:
            if hit_records:
                for code, records in hit_records.items():
                    f_out.write(f"=== 証券コード: {code} ===\n")
                    for r in records:
                        f_out.write(r)
                    f_out.write("\n")
            else:
                f_out.write("本日発表された対象銘柄の適時開示情報はありませんでした。\n")
        EOF
        
        python inline_script.py

    - name: Upload Result Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tdnet-result
        path: result.txt
        retention-days: 7
