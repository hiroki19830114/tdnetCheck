name: Daily TDnet Check

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run script
      run: |
        python chkTdnet.py
        
        if ls result_*.txt 1> /dev/null 2>&1; then
          FILENAME=$(ls result_*.txt | head -n 1)
          echo "RESULT_FILE=$FILENAME" >> $GITHUB_ENV
          echo "HAS_RESULT=true" >> $GITHUB_ENV
        else
          echo "HAS_RESULT=false" >> $GITHUB_ENV
          echo "本日発表された適時開示はありませんでした。" > no_result.txt
          echo "RESULT_FILE=no_result.txt" >> $GITHUB_ENV
        fi

    # 【変更】エラーの原因となっていたアクションを別の安定版に変更しました
    - name: Send Mail
      uses: prime-prime/send-email-action@v1.2.1
      with:
        smtp_server: "smtp.gmail.com"
        smtp_port: 465
        smtp_username: ${{ secrets.MAIL_USERNAME }}
        smtp_password: ${{ secrets.MAIL_PASSWORD }}
        
        subject: "【自動配信】TDnet適時開示 取得結果通知"
        to: "haruharuharu0114@gmail.com"
        from: "TDnet Bot"
        
        body: "本日の東証TDnet適時開示のチェックが完了しました。詳細は添付のテキストファイルをご確認ください。"
        attachments: "${{ env.RESULT_FILE }}"
