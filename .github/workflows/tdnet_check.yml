name: Daily TDnet Check

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script
      run: |
        cat << 'EOF' > inline_script.py
        import os
        from datetime import datetime
        import requests

        TXT_FILE = "code.txt"
        output_file = "result.txt"

        headers = {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        }

        # 最初に必ずresult.txtを生成
        with open(output_file, "w", encoding="utf-8") as f_init:
            f_init.write("=== 適時開示・決算速報 取得結果 (独立ミラーデータ版) ===\n")
            f_init.write(f"実行日時: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n")
            f_init.write("==================================================\n\n")

        if not os.path.exists(TXT_FILE):
            with open(output_file, "a", encoding="utf-8") as f_out:
                f_out.write(f"【エラー】{TXT_FILE} が見つかりません。\n")
            exit(0)

        codes = []
        with open(TXT_FILE, "r", encoding="utf-8") as f:
            for line in f:
                clean_line = line.strip()
                if not clean_line or clean_line.startswith("#"):
                    continue
                codes.append(clean_line)

        if not codes:
            with open(output_file, "a", encoding="utf-8") as f_out:
                f_out.write("【エラー】code.txt に証券コードがありません。\n")
            exit(0)

        hit_records = {}

        # 【修正】正しいホスト名（raw.githubusercontent.com）に変更しました
        url = "https://githubusercontent.com"
        
        try:
            response = requests.get(url, headers=headers, timeout=15)
            response.raise_for_status()
            disclosures = response.json()
            
            if isinstance(disclosures, list):
                for item in disclosures:
                    if not isinstance(item, dict):
                        continue
                    
                    raw_code = str(item.get("code", item.get("Code", item.get("LocalCode", ""))))
                    short_code = raw_code[:4] # 先頭4桁を抽出
                    
                    if short_code in codes:
                        time_text = item.get("time", item.get("Time", item.get("DisclosedTime", "時間不明")))
                        company_name = item.get("name", item.get("Name", item.get("CompanyName", "企業名不明")))
                        title_text = item.get("title", item.get("Title", "タイトルなし"))
                        
                        pdf_id = item.get("id", item.get("Id", item.get("DisclosureNumber", "")))
                        pdf_url = f"https://tdnet.info{pdf_id}.pdf" if pdf_id else "URLなし"
                        
                        record = f"[{time_text}] {company_name}\n  {title_text}\n  URL: {pdf_url}\n"
                        
                        if short_code not in hit_records:
                            hit_records[short_code] = []
                        if record not in hit_records[short_code]:
                            hit_records[short_code].append(record)
                        
        except Exception as e:
            with open(output_file, "a", encoding="utf-8") as f_out:
                f_out.write(f"【システムエラー】ミラーデータの取得に失敗しました: {e}\n")

        # 最後に結果を追記
        with open(output_file, "a", encoding="utf-8") as f_out:
            if hit_records:
                for code, records in hit_records.items():
                    f_out.write(f"=== 証券コード: {code} ===\n")
                    for r in records:
                        f_out.write(r)
                    f_out.write("\n")
            else:
                f_out.write("本日発表された対象銘柄の適時開示情報はありませんでした。\n")
        EOF
        
        python inline_script.py

    - name: Upload Result Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tdnet-result
        path: result.txt
        retention-days: 7
