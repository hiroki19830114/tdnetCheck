name: Daily TDnet Check

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run script
      run: |
        python chkTdnet.py
        
        if ls result_*.txt 1> /dev/null 2>&1; then
          FILENAME=$(ls result_*.txt | head -n 1)
          echo "RESULT_FILE=$FILENAME" >> $GITHUB_ENV
          echo "HAS_RESULT=true" >> $GITHUB_ENV
        else
          echo "HAS_RESULT=false" >> $GITHUB_ENV
          echo "本日発表された適時開示はありませんでした。" > no_result.txt
          echo "RESULT_FILE=no_result.txt" >> $GITHUB_ENV
        fi

    # 【修正】トラブルの多いメール送信をやめ、ファイルをGitHub上に安全に保存する方式に変更
    - name: Upload Result Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tdnet-result
        path: "${{ env.RESULT_FILE }}"
        retention-days: 7
